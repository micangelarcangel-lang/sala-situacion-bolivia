name: Malla de población (WorldPop + INE)

on:
  schedule:
    - cron: "0 12 2 1 *"      # una vez al año (2 de enero, 08:00 Bolivia): cambia el año de la proyección INE
  workflow_dispatch:          # botón manual (la primera vez hay que lanzarlo a mano)

permissions:
  contents: write

concurrency:
  group: poblacion
  cancel-in-progress: false

jobs:
  poblacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install numpy shapely rasterio
      - name: Pruebas de la malla (sin internet)
        run: |
          python -m unittest tests.test_poblacion -v
      - name: Descargar WorldPop y construir la malla (si falla, no toca el archivo anterior)
        run: python poblacion_malla.py
      - name: Guardar resultado
        run: |
          git config user.name "sala-bot"
          git config user.email "sala-bot@users.noreply.github.com"
          git add docs/poblacion_malla.json docs/poblacion_malla_meta.json
          if git diff --staged --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -m "Malla de población (WorldPop + INE)"
          for intento in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Intento $intento fallido; se reintenta en $((intento * 5)) s"
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 5))
          done
          echo "::error::No se pudo guardar la malla tras 5 intentos"
          exit 1
