name: Validar eventos y pruebas

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml pytest shapely matplotlib reportlab openpyxl
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Informe de calidad de los eventos actuales
        run: python validar.py docs/eventos_unificados.json --estricto
