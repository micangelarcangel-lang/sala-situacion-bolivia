name: Índice de riesgo diario

on:
  schedule:
    - cron: "40 11 * * *"     # 07:40 hora de Bolivia, todos los días (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón manual

permissions:
  contents: write

concurrency:
  group: riesgo
  cancel-in-progress: false

jobs:
  riesgo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar jsdom (solo para ejecutar el código del sitio en el motor)
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Calcular el índice de riesgo del día (solo lee archivos de docs/, sin internet)
        run: node riesgo_diario.js docs
      - name: Guardar resultados
        run: |
          git config user.name "sala-bot"
          git config user.email "sala-bot@users.noreply.github.com"
          git add docs/riesgo_diario.json docs/riesgo_historial.json
          if git diff --staged --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -m "Índice de riesgo diario"
          # Solo toca dos archivos propios; si el ciclo de la sala subió cambios, se rebasa y se reintenta.
          for intento in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Intento $intento fallido; se reintenta en $((intento * 5)) s"
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 5))
          done
          echo "::error::No se pudieron guardar los resultados tras 5 intentos"
          exit 1
