name: Lugares conocidos (descarga OSM)
on:
  push:
    branches-ignore: [main]
    paths: [lugares_solicitud.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import lugares_v3 as l, collections
          out, err = l.bajar("datos/lugares_osm.json")
          print("LUGARES", dict(collections.Counter(x["tipo"] for x in out)), "ERRORES", err)
          PY
      - run: |
          git config user.name "sala-bot" && git config user.email "sala-bot@users.noreply.github.com"
          git add datos/lugares_osm.json
          git commit -m "datos: lugares OSM" datos/lugares_osm.json || echo sin cambios
          git pull --rebase -q || true
          git push || echo "no se pudo subir"
