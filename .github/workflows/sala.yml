name: Sala de Situación

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón manual: reporte por solicitud
    inputs:
      modo:
        description: "Escriba solicitud para generar un reporte ahora"
        default: "solicitud"
      horas:
        description: "Horas hacia atrás que cubre el reporte (24 = un día, 168 = una semana)"
        default: "24"
      buscar:
        description: "Opcional: palabras del hecho para un reporte específico (ej: Caranavi accidente). Vacío = reporte general"
        default: ""

permissions:
  contents: write

concurrency:
  group: sala
  cancel-in-progress: false

jobs:
  sala:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Navegador para portales con JavaScript (si falla, el sistema sigue sin él)
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Retención de reportes PDF, 90 días (si falla, no detiene el sistema)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RETENCION_DIAS: "90"
        run: python retener_reportes.py
      - name: Descargar datos y generar reportes
        env:
          DATOS_URL: ${{ secrets.DATOS_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MODO: ${{ github.event.inputs.modo }}
          HORAS: ${{ github.event.inputs.horas }}
          BUSCAR: ${{ github.event.inputs.buscar }}
        run: python ejecutar.py
      - name: Alerta de sismo M>=4,0 (si falla, no detiene el sistema)
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python alerta_sismo.py
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "sala-bot"
          git config user.email "sala-bot@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -m "Actualización automática"
          # Si alguien más subió cambios mientras corría el ciclo, se rebasa y se reintenta;
          # si no se logra, el ciclo falla de forma visible (no se pierde en silencio).
          for intento in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Intento $intento fallido; se reintenta en $((intento * ${REINTENTO_S:-5})) s"
            git rebase --abort 2>/dev/null || true
            sleep $((intento * ${REINTENTO_S:-5}))
          done
          echo "::error::No se pudieron guardar los resultados tras 5 intentos"
          exit 1
