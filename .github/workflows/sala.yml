name: Sala de Situación

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Escriba solicitud para generar un reporte ahora"
        default: "solicitud"
      horas:
        description: "Horas hacia atrás que cubre el reporte (24 = un día, 168 = una semana)"
        default: "24"
      buscar:
        description: "Opcional: palabras del hecho para un informe específico (ej: Mayaya). Vacío = reporte general"
        default: ""

permissions:
  contents: write

concurrency:
  group: sala
  cancel-in-progress: false

jobs:
  sala:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:

          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar datos y generar reportes
        env:
          DATOS_URL: ${{ secrets.DATOS_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MODO: ${{ github.event.inputs.modo }}
          HORAS: ${{ github.event.inputs.horas }}
          BUSCAR: ${{ github.event.inputs.buscar }}
        run: python ejecutar.py
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "sala-bot"
          git config user.email "sala-bot@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualización automática"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            sleep 6
          done
          exit 1
