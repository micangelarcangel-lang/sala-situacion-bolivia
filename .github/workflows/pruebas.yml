name: Pruebas del motor

on:
  push:
    branches: [main, v3-prueba-de-valor]
    paths: ["*.py", "requirements.txt", "tests/**", ".github/workflows/pruebas.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt rasterio
      - name: Compilar todos los módulos
        run: python -m compileall -q *.py
      - name: Pruebas (sin internet)
        run: python -m unittest discover -s tests -v
