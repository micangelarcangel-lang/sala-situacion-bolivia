name: Lector de enlaces (rama de prueba)
# Se dispara al subir un cambio a leer_fuentes.txt (una URL por línea). Guarda texto y enlaces en datos/v3/fuentes/. No toca main ni el correo.
on:
  push:
    branches-ignore: [main]
    paths: [leer_fuentes.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 lxml trafilatura pypdf playwright && playwright install --with-deps chromium
      - run: python herramientas/leer_url.py leer_fuentes.txt
      - name: Guardar
        run: |
          git config user.name "sala-bot" && git config user.email "sala-bot@users.noreply.github.com"
          git add datos/v3/fuentes
          git commit -m "fuentes leídas" datos/v3/fuentes || echo "sin cambios"
          git pull --rebase -q -X ours || true
          git push || echo "no se pudo subir"
