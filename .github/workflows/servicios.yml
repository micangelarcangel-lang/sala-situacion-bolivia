name: Servicios cercanos (descarga OSM)
on:
  push:
    branches-ignore: [main]
    paths: [servicios_solicitud.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import servicios_cercanos as s, collections
          out, err = s.bajar("servicios_out/servicios.json")
          print("SERVICIOS", dict(collections.Counter(x["tipo"] for x in out)), "sin nombre:", sum(1 for x in out if x["nombre"].startswith("(sin")))
          print("ERRORES", err)
          r = s.cercanos(-16.5, -68.15, out)
          for t, l in r.items():
              print("CERCA", t, [(x["nombre"], x["km"]) for x in l])
          PY
      - name: Guardar copia en la rama
        run: |
          mkdir -p datos && cp servicios_out/servicios.json datos/servicios_osm.json
          git config user.name "sala-bot" && git config user.email "sala-bot@users.noreply.github.com"
          git add datos/servicios_osm.json && git commit -m "datos: servicios OSM" || echo sin cambios
          git push || echo "no se pudo subir"
