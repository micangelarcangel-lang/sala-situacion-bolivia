name: Probar SENAMHI 9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo sin-dependencias
      - run: python probar_senamhi9.py
      - name: Guardar resultado
        run: |
          git config user.name "sala-bot"
          git config user.email "sala-bot@users.noreply.github.com"
          git add docs/senamhi_prueba9.txt
          git diff --staged --quiet || (git commit -m "Prueba SENAMHI 9" && git pull --rebase && git push)
